<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tankpreise</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a23;
    --card: #1c2130;
    --border: #252d3f;
    --accent-diesel: #00c896;
    --accent-benzin: #ff6b35;
    --accent: var(--accent-diesel);
    --text: #e8eaf0;
    --muted: #6b7591;
    --cheapest: #00c896;
    --mid: #f5c518;
    --exp: #ff4757;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,200,150,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,200,150,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 700px;
    margin: 0 auto;
    padding: 32px 16px 80px;
  }

  /* Header */
  header {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    margin-bottom: 36px;
  }
  .logo-icon {
    width: 52px; height: 52px;
    background: var(--accent);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px;
    flex-shrink: 0;
    transition: background .3s;
    box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(36px, 8vw, 52px);
    letter-spacing: 2px;
    line-height: 1;
  }
  h1 span { color: var(--accent); transition: color .3s; }

  /* Fuel toggle */
  .fuel-toggle {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 5px;
    gap: 4px;
    margin-bottom: 20px;
  }
  .fuel-btn {
    flex: 1;
    padding: 12px 0;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    background: transparent;
    color: var(--muted);
    transition: all .25s;
    letter-spacing: .5px;
  }
  .fuel-btn.active {
    background: var(--accent);
    color: #0d0f14;
    box-shadow: 0 2px 14px color-mix(in srgb, var(--accent) 35%, transparent);
  }

  /* Controls */
  .controls {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: flex-end;
  }
  .field {
    flex: 1;
    min-width: 180px;
  }
  label {
    display: block;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  input[type=number], input[type=text] {
    width: 100%;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    padding: 11px 14px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  .btn-locate, .btn-search {
    padding: 12px 22px;
    border: none;
    border-radius: 10px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn-locate {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--text);
  }
  .btn-locate:hover { border-color: var(--accent); color: var(--accent); }
  .btn-search {
    background: var(--accent);
    color: #0d0f14;
    box-shadow: 0 2px 16px color-mix(in srgb, var(--accent) 30%, transparent);
  }
  .btn-search:hover { filter: brightness(1.1); transform: translateY(-1px); }
  .btn-search:active { transform: translateY(0); }
  .btn-search:disabled { opacity: .5; cursor: default; transform: none; }

  /* Status bar */
  .status {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 20px;
    min-height: 18px;
  }
  .status.err { color: var(--exp); }
  .status.ok { color: var(--accent); }

  /* Sort tabs */
  .sort-row {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .sort-btn {
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all .2s;
  }
  .sort-btn.active { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }

  /* Cards */
  .station-list { display: flex; flex-direction: column; gap: 10px; }

  .station-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 20px;
    display: grid;
    grid-template-columns: 1fr auto;
    grid-template-rows: auto auto;
    gap: 4px 16px;
    align-items: center;
    animation: slideIn .3s ease both;
    cursor: default;
    transition: border-color .2s, transform .15s;
    position: relative;
    overflow: hidden;
  }
  .station-card:hover { border-color: var(--border); transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,.3); }
  .station-card.rank-1 { border-color: var(--accent); }
  .station-card.rank-1::before {
    content: '⚡ GÜNSTIGSTE';
    position: absolute;
    top: 0; right: 0;
    background: var(--accent);
    color: #0d0f14;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 10px;
    border-bottom-left-radius: 10px;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .station-name {
    font-weight: 600;
    font-size: 16px;
    color: var(--text);
  }
  .station-addr {
    font-size: 13px;
    color: var(--muted);
    grid-column: 1;
  }
  .station-dist {
    font-size: 12px;
    color: var(--muted);
    text-align: right;
  }
  .price-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 1px;
    line-height: 1;
    grid-row: 1 / 3;
    grid-column: 2;
    text-align: right;
    align-self: center;
  }
  .price-big.cheap  { color: var(--cheapest); }
  .price-big.mid    { color: var(--mid); }
  .price-big.exp    { color: var(--exp); }

  /* Open badge */
  .open-badge {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: .5px;
    padding: 2px 8px;
    border-radius: 20px;
    margin-left: 8px;
    vertical-align: middle;
  }
  .open-badge.open   { background: rgba(0,200,150,.15); color: var(--accent); }
  .open-badge.closed { background: rgba(255,71,87,.12); color: var(--exp); }

  /* Spinner */
  .spinner {
    display: flex; justify-content: center; padding: 60px 0;
  }
  .spinner::after {
    content: '';
    width: 40px; height: 40px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty {
    text-align: center;
    padding: 60px 0;
    color: var(--muted);
    font-size: 15px;
  }
  .empty .icon { font-size: 48px; margin-bottom: 12px; }

  /* Radius badge */
  .radius-info {
    font-size: 11px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 20px;
    padding: 3px 10px;
    display: inline-block;
    margin-bottom: 14px;
    transition: all .3s;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo-icon" id="logoIcon">⛽</div>
    <div>
      <h1>TANK<span id="fuelLabel">DIESEL</span></h1>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:clamp(36px,8vw,52px);letter-spacing:2px;color:var(--muted);margin-top:0;line-height:1;">Aktuelle Preise in deiner Nähe</div>
      <div style="font-size:10px;color:var(--muted);margin-top:4px;letter-spacing:.5px;opacity:.6;">Powered by ARNI · Claude Coding</div>
    </div>
  </header>

  <!-- Fuel toggle -->
  <div class="fuel-toggle">
    <button class="fuel-btn active" id="btnDiesel" onclick="setFuel('diesel')">🛢 Diesel</button>
    <button class="fuel-btn" id="btnE5" onclick="setFuel('e5')">⛽ Super E5</button>
    <button class="fuel-btn" id="btnE10" onclick="setFuel('e10')">🌿 Super E10</button>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="field" style="flex:2;min-width:200px;">
      <label>Standort (Lat, Lon)</label>
      <input type="text" id="locInput" placeholder="z.B. 49.452, 11.076" />
    </div>
    <div class="field" style="flex:0 0 110px;min-width:110px;">
      <label>Radius (km)</label>
      <input type="number" id="radiusInput" value="5" min="1" max="25" />
    </div>
    <button class="btn-locate" onclick="locate()" title="GPS-Standort ermitteln">📍 GPS</button>
    <button class="btn-search" id="btnSearch" onclick="search()">Suchen →</button>
  </div>

  <div class="status" id="status"></div>

  <div id="sortRow" class="sort-row" style="display:none;">
    <span style="font-size:12px;color:var(--muted);padding:6px 0;">Sortieren:</span>
    <button class="sort-btn" onclick="sortBy('price')">💰 Preis</button>
    <button class="sort-btn active" onclick="sortBy('dist')">📏 Entfernung</button>
    <button class="sort-btn" onclick="sortBy('name')">🔤 Name</button>
  </div>

  <div id="radiusBadge" class="radius-info" style="display:none;"></div>
  <div id="stationList" class="station-list"></div>
</div>

<script>
let fuelType = 'diesel';
let stations = [];
let sortKey = 'dist';

function setFuel(type) {
  fuelType = type;
  document.querySelectorAll('.fuel-btn').forEach(b => b.classList.remove('active'));
  const map = { diesel: 'btnDiesel', e5: 'btnE5', e10: 'btnE10' };
  document.getElementById(map[type]).classList.add('active');

  const labels = { diesel: 'DIESEL', e5: 'SUPER E5', e10: 'SUPER E10' };
  document.getElementById('fuelLabel').textContent = labels[type];

  const colors = { diesel: '#00c896', e5: '#ff6b35', e10: '#5ba4ff' };
  document.documentElement.style.setProperty('--accent', colors[type]);

  if (stations.length) renderCards();
}

function locate() {
  setStatus('📍 Standort wird ermittelt…');
  if (!navigator.geolocation) { setStatus('Geolocation nicht unterstützt.', 'err'); return; }
  navigator.geolocation.getCurrentPosition(
    pos => {
      const { latitude: lat, longitude: lon } = pos.coords;
      document.getElementById('locInput').value = `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
      setStatus(`✓ Standort gefunden: ${lat.toFixed(4)}, ${lon.toFixed(4)}`, 'ok');
    },
    err => setStatus('GPS-Zugriff verweigert oder Fehler.', 'err')
  );
}

function parseCoords() {
  const raw = document.getElementById('locInput').value.trim();
  const parts = raw.split(/[,\s]+/).map(Number);
  if (parts.length >= 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
    return { lat: parts[0], lon: parts[1] };
  }
  return null;
}

async function search() {
  const coords = parseCoords();
  if (!coords) { setStatus('Bitte gültige Koordinaten eingeben oder GPS nutzen.', 'err'); return; }
  const radius = parseFloat(document.getElementById('radiusInput').value) || 5;

  setStatus('🔍 Lade Tankstellendaten…');
  document.getElementById('stationList').innerHTML = '<div class="spinner"></div>';
  document.getElementById('sortRow').style.display = 'none';
  document.getElementById('radiusBadge').style.display = 'none';
  document.getElementById('btnSearch').disabled = true;

  try {
    const apiUrl = `https://creativecommons.tankerkoenig.de/json/list.php?lat=${coords.lat}&lng=${coords.lon}&rad=${radius}&sort=dist&type=all&apikey=a73d8fa4-0395-4ca9-b550-e93f5efd6748`;
    const proxies = [
      u => u,
      u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
      u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,
    ];
    let data = null;
    let lastErr = '';
    for (const makeUrl of proxies) {
      try {
        const resp = await fetch(makeUrl(apiUrl));
        if (!resp.ok) { lastErr = `HTTP ${resp.status}`; continue; }
        const json = await resp.json();
        if (json.ok) { data = json; break; }
        lastErr = json.message || 'API-Fehler';
      } catch(e) { lastErr = e.message; }
    }
    if (!data) throw new Error(lastErr || 'Alle Verbindungsversuche fehlgeschlagen');

    stations = (data.stations || []).filter(s => s[fuelType] != null && s[fuelType] !== false && s[fuelType] > 0);

    if (!stations.length) {
      setStatus('', '');
      document.getElementById('stationList').innerHTML = `<div class="empty"><div class="icon">🔍</div>Keine Tankstellen mit ${fuelType.toUpperCase()}-Preis gefunden.</div>`;
      return;
    }

    setStatus(`✓ ${stations.length} Tankstellen gefunden`, 'ok');
    document.getElementById('sortRow').style.display = 'flex';
    document.getElementById('radiusBadge').style.display = 'inline-block';
    document.getElementById('radiusBadge').textContent = `${radius} km Radius · ${stations.length} Stationen`;
    renderCards();
  } catch (e) {
    setStatus('Fehler beim Laden: ' + e.message, 'err');
    document.getElementById('stationList').innerHTML = `<div class="empty"><div class="icon">⚠️</div>${e.message}</div>`;
  } finally {
    document.getElementById('btnSearch').disabled = false;
  }
}

function sortBy(key) {
  sortKey = key;
  document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  renderCards();
}

function renderCards() {
  const sorted = [...stations].sort((a, b) => {
    if (sortKey === 'price') return (a[fuelType] || 99) - (b[fuelType] || 99);
    if (sortKey === 'dist')  return a.dist - b.dist;
    if (sortKey === 'name')  return a.name.localeCompare(b.name);
    return 0;
  });

  const prices = sorted.map(s => s[fuelType]).filter(Boolean);
  const min = Math.min(...prices);
  const max = Math.max(...prices);
  const range = max - min || 1;

  const list = document.getElementById('stationList');
  list.innerHTML = '';

  sorted.forEach((s, i) => {
    const price = s[fuelType];
    const ratio = (price - min) / range;
    const cls = ratio < 0.25 ? 'cheap' : ratio < 0.65 ? 'mid' : 'exp';
    const rankClass = (sortKey === 'price' && i === 0) ? 'rank-1' : '';
    const openHtml = s.isOpen
      ? '<span class="open-badge open">OFFEN</span>'
      : '<span class="open-badge closed">GESCHLOSSEN</span>';
    const priceStr = price.toFixed(3).replace('.', ',');
    const addr = [s.street, s.houseNumber, s.place].filter(Boolean).join(' ');

    const card = document.createElement('div');
    card.className = `station-card ${rankClass}`;
    card.style.animationDelay = `${i * 40}ms`;
    card.innerHTML = `
      <div class="station-name">${s.brand || s.name} ${openHtml}</div>
      <div class="station-addr">${addr}</div>
      <div class="station-dist">${s.dist?.toFixed(1)} km</div>
      <div class="price-big ${cls}">${priceStr}<span style="font-size:18px">€</span></div>
    `;
    card.onclick = () => {
      window.open(`https://www.google.com/maps/search/?api=1&query=${s.lat},${s.lng}`, '_blank');
    };
    card.style.cursor = 'pointer';
    card.title = 'In Google Maps öffnen';
    list.appendChild(card);
  });
}

function setStatus(msg, type) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}
</script>
</body>
</html>
